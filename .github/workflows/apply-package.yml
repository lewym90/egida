name: Zastosuj paczkę
on:
  push:
    branches: [main]
    paths: ["egida-*.zip"]
permissions:
  contents: write
  pages: write
concurrency:
  group: apply-package
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rozpakuj i wstaw pliki
        run: |
          set -euo pipefail
          shopt -s nullglob
          zips=(egida-*.zip)
          if [ ${#zips[@]} -eq 0 ]; then echo "Brak paczki – nic do zrobienia."; exit 0; fi
          for z in "${zips[@]}"; do
            echo "== $z"
            rm -rf /tmp/pk && mkdir /tmp/pk
            unzip -q "$z" -d /tmp/pk
            [ "$(ls /tmp/pk | wc -l)" -eq 1 ] || { echo "Zip ma mieć jeden folder główny (egida-main)."; exit 1; }
            src="/tmp/pk/$(ls /tmp/pk)"
            [ -f "$src/index.html" ] && [ -f "$src/sw.js" ] || { echo "To nie wygląda na paczkę EGIDA (brak index.html / sw.js)."; exit 1; }
            rm -rf "$src/.git" "$src/.github" "$src/node_modules"
            cp -a "$src"/. ./
            git rm -q --cached -- "$z" 2>/dev/null || true
            rm -f -- "$z"
          done
          git config user.name "egida-bot"
          git config user.email "egida-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Brak zmian."; exit 0; }
          git commit -q -m "Paczka wgrana z telefonu: ${zips[*]}"
          git push
      - name: Odśwież GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages odświeży się samo."
